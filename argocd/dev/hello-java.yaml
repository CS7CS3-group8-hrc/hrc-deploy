apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-hello-java
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CS7CS3-group8-hrc/hrc-deploy.git
    targetRevision: main
    path: charts/hrc-service
    helm:
      releaseName: hello-java
      valueFiles:
        - ../../envs/dev/hello-java.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hrc-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true